apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apply order matters: namespace + policy first, then identity, then workload.
resources:
  - networkpolicy.yaml   # namespace 'agents' is defined here
  - rbac.yaml
  - agent-deployment.yaml
# seccomp-fallback.yaml is documentation only (node-level file), not applied.
