# =============================================================================
# CHANGE layer: the agent can OBSERVE the whole cluster but MUTATE nothing.
#
# This is the heart of the talk: an agent that can `kubectl patch` can also
# `kubectl delete`. So we don't give it patch/delete/create at all. It reads
# cluster reality (via the Flux MCP server in read-only mode), reasons, and
# proposes change as a Git pull request. Flux reconciles what a human approves.
# Rollback is `git revert`, not "hope you had a backup".
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: review-agent
  namespace: agents
---
# Cluster-wide READ-ONLY. Note: only get/list/watch. No create/update/patch/
# delete anywhere. No access to Secrets (the MCP server masks secret values,
# and we don't grant them here either).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: review-agent-readonly
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - namespaces
      - events
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  # Flux resources: the agent debugs the GitOps pipeline end-to-end, read-only.
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Explicitly NOT granted: secrets (any verb), and ANY write verb on anything.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: review-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: review-agent-readonly
subjects:
  - kind: ServiceAccount
    name: review-agent
    namespace: agents
