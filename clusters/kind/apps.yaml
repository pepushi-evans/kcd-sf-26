# Reconciles ./apps from this repo. This is the change layer of the demo:
# the capacity agent's PRs land in apps/checkout/hpa.yaml, a human merges,
# and this Kustomization makes the cluster follow the repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
