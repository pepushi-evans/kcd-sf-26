# Helm values for flux-operator on the local demo cluster.
#
# Anonymous web UI auth: every visitor is user `flux` in group `flux-admin`,
# which infra/flux-ui-admin-rbac.yaml binds to the chart's `flux-web-admin`
# ClusterRole — that unlocks the UI's GitOps actions (reconcile, suspend,
# resume, rollout restart) and the pod log viewer. Local kind demo ONLY:
# anyone who can reach port 8080 gets those powers. Real clusters use SSO.
web:
  config:
    authentication:
      type: Anonymous
      anonymous:
        username: flux
        groups:
          - flux-admin
