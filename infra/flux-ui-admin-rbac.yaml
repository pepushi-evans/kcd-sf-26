# Grants the web UI's anonymous group full Flux UI powers (view + reconcile/
# suspend/resume/restart + log viewer) via the chart-managed flux-web-admin
# ClusterRole. Pairs with infra/flux-operator-values.yaml. Local demo only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-admin-anonymous
subjects:
  - kind: Group
    name: flux-admin
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flux-web-admin
  apiGroup: rbac.authorization.k8s.io
